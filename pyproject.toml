[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-intelligence"
version = "1.0.0"
description = "Multi-Modal Chest X-Ray Intelligence System (Report Generation + RAG QA)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.50.0",
    "accelerate>=0.27.0",
    "open-clip-torch>=2.24.0",
    "peft>=0.9.0",
    "qdrant-client>=1.9.0",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "evaluate>=0.4.0",
    "nltk>=3.8.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "gradio>=4.20.0",
]

[project.optional-dependencies]
finetune = [
    "bitsandbytes>=0.43.0",
    "trl>=0.8.0",
]
colpali = [
    "colpali-engine>=0.3.0",
]
qa-gen = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]
all = [
    "cxr-intelligence[finetune,colpali,qa-gen,dev]",
]

[project.scripts]
cxr-quickstart = "scripts.quickstart:main"
cxr-app       = "app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
